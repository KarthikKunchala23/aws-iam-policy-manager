policy_name: catalog-dynamodb-policy

description: IAM policy for Catalog DynamoDB access

template: managed_policy.j2

path: /

actions:
  - dynamodb:GetItem
  - dynamodb:BatchGetItem
  - dynamodb:Query
  - dynamodb:Scan

resources:
  - arn:aws:dynamodb:ap-south-1:123456789012:table/catalog

tags:
  - Key: Environment
    Value: Development

  - Key: Service
    Value: Catalog