[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-iam-policy-manager"
version = "1.0.0"
description = "Generate and synchronize AWS IAM policies from json templates and create/sync with AWS IAM"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
